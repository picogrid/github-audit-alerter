---
version: "2"
run:
  issues-exit-code: 1
  timeout: 10m
linters:
  # errcheck, govet, ineffassign, staticcheck (which now includes stylecheck) and unused are on by default.
  enable:
    - asciicheck
    - errorlint
    - gocritic
    - gosec
    - importas
    - misspell
    - prealloc
    - revive
    - tparallel
    - unconvert
    - unparam
    - whitespace
  settings:
    staticcheck:
      # Match the v1 staticcheck and stylecheck defaults; v2 adds the QF quick-fix suggestions.
      checks: ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022", "-QF*"]
formatters:
  enable:
    - gofmt
    - goimports
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false
